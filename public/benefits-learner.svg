  <ellipse cx="240" cy="270" rx="74" ry="28" fill="#E85D6C"/>
  <path d="M222 286 L216 350 M258 286 L264 350" stroke="#FFE3E6" stroke-width="5" stroke-linecap="round"/>
  <!-- neck -->
  <path d="M212 226 L268 226 L270 270 C250 286 230 286 210 270Z" fill="#E2A07F"/>
  <!-- hair back (curly) -->
  <g fill="#C98349">
    <circle cx="170" cy="150" r="40"/><circle cx="310" cy="150" r="40"/><circle cx="240" cy="92" r="52"/>
    <circle cx="190" cy="104" r="40"/><circle cx="290" cy="104" r="40"/><circle cx="160" cy="205" r="32"/><circle cx="320" cy="205" r="32"/>
    <circle cx="150" cy="170" r="26"/><circle cx="330" cy="170" r="26"/>
  </g>
  <!-- face -->
  <ellipse cx="240" cy="164" rx="64" ry="76" fill="url(#skin)"/>
  <!-- fringe -->
  <g fill="#D4915A">
    <circle cx="198" cy="106" r="30"/><circle cx="236" cy="96" r="32"/><circle cx="278" cy="106" r="30"/><circle cx="170" cy="130" r="22"/><circle cx="310" cy="130" r="22"/>
  </g>
  <!-- glasses -->
  <circle cx="212" cy="160" r="21" fill="#fff" fill-opacity=".25" stroke="#3B3B40" stroke-width="3"/>
  <circle cx="268" cy="160" r="21" fill="#fff" fill-opacity=".25" stroke="#3B3B40" stroke-width="3"/>
  <path d="M233 158 Q240 152 247 158" stroke="#3B3B40" stroke-width="3" fill="none"/>
  <circle cx="212" cy="161" r="5" fill="#4A3426"/><circle cx="268" cy="161" r="5" fill="#4A3426"/>
  <path d="M196 140 Q212 132 228 140 M252 140 Q268 132 284 140" stroke="#A8693A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M240 168 Q235 186 243 190" stroke="#CE8E6C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M212 206 Q240 234 270 206 Q240 216 212 206Z" fill="#fff" stroke="#C0624F" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="196" cy="196" rx="10" ry="6" fill="#EE8E80" opacity=".4"/><ellipse cx="284" cy="196" rx="10" ry="6" fill="#EE8E80" opacity=".4"/>
  <!-- laptop -->
  <rect x="150" y="330" width="190" height="136" rx="10" fill="#C4C4C6"/>
  <rect x="156" y="336" width="178" height="124" rx="7" fill="#D0D0D2"/>
  <!-- hands -->
  <ellipse cx="348" cy="418" rx="20" ry="28" fill="url(#skin)" transform="rotate(10 348 418)"/>
  <ellipse cx="144" cy="448" rx="22" ry="18" fill="url(#skin)"/>
  <path d="M128 440 q12 -10 26 -4 M130 452 q12 -8 26 -2" stroke="#CE8E6C" stroke-width="2" fill="none" stroke-linecap="round"/>
