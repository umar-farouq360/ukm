  <path d="M96 480 C80 360 140 262 240 256 C340 262 400 360 384 480 L384 500 L96 500Z" fill="url(#hood)"/>
  <!-- sleeves -->
  <path d="M110 330 C70 380 80 450 120 470 L170 440 C150 410 150 380 160 340Z" fill="#F4707E"/>
  <path d="M370 330 C410 380 400 450 360 470 L310 440 C330 410 330 380 320 340Z" fill="#F4707E"/>
