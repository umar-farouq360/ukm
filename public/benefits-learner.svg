<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-label="Smiling learner sitting cross-legged with a laptop">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3BC9C"/><stop offset="1" stop-color="#E5A583"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F98A93"/><stop offset="1" stop-color="#F06B79"/></linearGradient>
    <linearGradient id="jeans" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5C89B5"/><stop offset="1" stop-color="#456E98"/></linearGradient>
  </defs>
  <!-- legs (crossed) -->
  <path d="M96 470 C40 510 44 586 100 606 L250 606 C300 606 330 560 330 520 L330 470Z" fill="url(#jeans)"/>
  <path d="M384 470 C440 510 436 586 380 606 L230 606 C180 606 150 560 150 520 L150 470Z" fill="#4E7BA8"/>
  <path d="M150 560 C190 540 230 548 262 574" stroke="#3F6690" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M72 574 l14 -6 M60 590 l16 -4" stroke="#E8EEF5" stroke-width="3" stroke-linecap="round"/>
  <!-- sneakers -->
  <path d="M60 596 C60 576 120 570 170 590 C190 600 190 626 170 630 L80 632 C62 630 58 612 60 596Z" fill="#F4F4F6" stroke="#D9DCE2" stroke-width="2"/>
  <path d="M420 596 C420 576 360 570 310 590 C290 600 290 626 310 630 L400 632 C418 630 422 612 420 596Z" fill="#F4F4F6" stroke="#D9DCE2" stroke-width="2"/>
